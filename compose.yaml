services:
  api:
    build: .
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PYTHONPATH: /app
    volumes:
      - models:/app/models
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: .
    command: ["streamlit", "run", "web_app/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://gateway:8000
      PYTHONPATH: /app
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - models:/app/models
      - app_data:/app/data
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  models:
  app_data:
